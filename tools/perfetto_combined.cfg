buffers: {
    size_kb: 65536
    fill_policy: RING_BUFFER
}
buffers: {
    size_kb: 32768
    fill_policy: RING_BUFFER
}

# ─── 数据源 1：System Trace（全局时间线）───
data_sources: {
    config {
        name: "linux.ftrace"
        target_buffer: 0
        ftrace_config {
            atrace_categories: "am"
            atrace_categories: "dalvik"
            atrace_categories: "wm"
            atrace_categories: "view"
            atrace_categories: "res"
            atrace_categories: "gfx"
            atrace_apps: "com.iwatchme.android"
        }
    }
}

# ─── 数据源 2：Java/Native 调用栈采样（方法级细节）───
# 参考: https://perfetto.dev/docs/getting-started/cpu-profiling
data_sources: {
    config {
        name: "linux.perf"
        target_buffer: 1
        perf_event_config {
            timebase {
                counter: SW_CPU_CLOCK
                frequency: 100
                timestamp_clock: PERF_CLOCK_MONOTONIC
            }
            callstack_sampling {
                scope {
                    target_cmdline: "com.iwatchme.android"
                }
                kernel_frames: false
            }
        }
    }
}

duration_ms: 20000
