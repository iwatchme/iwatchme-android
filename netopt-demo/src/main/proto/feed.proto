syntax = "proto3";

package netopt;

option java_package = "com.iwatchme.netopt.proto";
option java_multiple_files = true;
option java_outer_classname = "FeedProto";

message FeedItem {
  int64 id = 1;
  int64 version = 2;
  string title = 3;
  string content = 4;
  int64 updated_at = 5;
}

message FeedItemList {
  repeated FeedItem items = 1;
}
