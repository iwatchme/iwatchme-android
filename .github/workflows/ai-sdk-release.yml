name: AI SDK Release

on:
  push:
    tags:
      - "ai-sdk-v*"

permissions:
  contents: write
  packages: write

defaults:
  run:
    working-directory: ai-sdk

jobs:
  # ── Android / JVM: publish to GitHub Packages Maven ──
  publish-maven:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#ai-sdk-v}" >> "$GITHUB_ENV"

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── iOS: build XCFrameworks and upload to GitHub Release ──
  publish-xcframework:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#ai-sdk-v}" >> "$GITHUB_ENV"

      - name: Build XCFrameworks
        run: |
          ./gradlew :ai-core:assembleAiCoreReleaseXCFramework
          ./gradlew :ai-tts:assembleAiTtsReleaseXCFramework
          ./gradlew :ai-translation:assembleAiTranslationReleaseXCFramework
          ./gradlew :ai-asr:assembleAiAsrReleaseXCFramework

      - name: Zip XCFrameworks
        run: |
          cd ai-core/build/XCFrameworks/release
          zip -r ../../../../AiCore.xcframework.zip AiCore.xcframework
          cd ../../../../
          cd ai-tts/build/XCFrameworks/release
          zip -r ../../../../AiTts.xcframework.zip AiTts.xcframework
          cd ../../../../
          cd ai-translation/build/XCFrameworks/release
          zip -r ../../../../AiTranslation.xcframework.zip AiTranslation.xcframework
          cd ../../../../
          cd ai-asr/build/XCFrameworks/release
          zip -r ../../../../AiAsr.xcframework.zip AiAsr.xcframework

      - name: Compute checksums
        id: checksums
        run: |
          echo "ai_core_checksum=$(swift package compute-checksum AiCore.xcframework.zip)" >> "$GITHUB_OUTPUT"
          echo "ai_tts_checksum=$(swift package compute-checksum AiTts.xcframework.zip)" >> "$GITHUB_OUTPUT"
          echo "ai_translation_checksum=$(swift package compute-checksum AiTranslation.xcframework.zip)" >> "$GITHUB_OUTPUT"
          echo "ai_asr_checksum=$(swift package compute-checksum AiAsr.xcframework.zip)" >> "$GITHUB_OUTPUT"

      - name: Generate Package.swift
        run: |
          TAG="${GITHUB_REF_NAME}"
          CORE_CHECKSUM="${{ steps.checksums.outputs.ai_core_checksum }}"
          TTS_CHECKSUM="${{ steps.checksums.outputs.ai_tts_checksum }}"
          TRANSLATION_CHECKSUM="${{ steps.checksums.outputs.ai_translation_checksum }}"
          ASR_CHECKSUM="${{ steps.checksums.outputs.ai_asr_checksum }}"
          REPO_URL="https://github.com/iwatchme/iwatchme-android/releases/download/${TAG}"

          cat > Package.swift << SWIFT
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "AiSdk",
              platforms: [
                  .iOS(.v14),
              ],
              products: [
                  .library(name: "AiCore", targets: ["AiCore"]),
                  .library(name: "AiTts", targets: ["AiTts"]),
                  .library(name: "AiTranslation", targets: ["AiTranslation"]),
                  .library(name: "AiAsr", targets: ["AiAsr"]),
              ],
              targets: [
                  .binaryTarget(
                      name: "AiCore",
                      url: "${REPO_URL}/AiCore.xcframework.zip",
                      checksum: "${CORE_CHECKSUM}"
                  ),
                  .binaryTarget(
                      name: "AiTts",
                      url: "${REPO_URL}/AiTts.xcframework.zip",
                      checksum: "${TTS_CHECKSUM}"
                  ),
                  .binaryTarget(
                      name: "AiTranslation",
                      url: "${REPO_URL}/AiTranslation.xcframework.zip",
                      checksum: "${TRANSLATION_CHECKSUM}"
                  ),
                  .binaryTarget(
                      name: "AiAsr",
                      url: "${REPO_URL}/AiAsr.xcframework.zip",
                      checksum: "${ASR_CHECKSUM}"
                  ),
              ]
          )
          SWIFT

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ai-sdk/AiCore.xcframework.zip
            ai-sdk/AiTts.xcframework.zip
            ai-sdk/AiTranslation.xcframework.zip
            ai-sdk/AiAsr.xcframework.zip
            ai-sdk/Package.swift
          fail_on_unmatched_files: true

  # ── Update Package.swift in repo after release ──
  update-package-swift:
    needs: publish-xcframework
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Package.swift from release
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release download "${TAG}" -p "Package.swift" -D ai-sdk/ --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-sdk/Package.swift
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update ai-sdk Package.swift for ${GITHUB_REF_NAME}"
            git push
          fi
        working-directory: .
