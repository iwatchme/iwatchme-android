[versions]
androidGradlePlugin = "8.12.0"
kotlin = "2.0.21"
coroutines = "1.9.0"
appcompat = "1.6.1"
core-ktx = "1.9.0"
material = "1.8.0"
junit = "4.13.2"
androidx-test-junit = "1.1.5"
androidx-test-espresso = "3.5.1"
kotlin-serialization = "1.7.3"
startup = "1.1.0"
compose-activity = "1.6.0"
compose-compiler = "1.3.1"
compose-foundation = "1.3.1"
compose-runtime = "1.3.3"
compose-ui = "1.3.3"
compose-navigation = "2.5.3"
compose-viewmodel = "2.5.1"
compose-constraintlayout = "1.1.0-alpha10"
exoplayer = "2.18.0"
dagger = "2.51.1"
media3 = "1.4.1"
fragment-ktx = "1.8.5"
lifecycle = "2.8.7"
recyclerview = "1.3.2"
constraintlayout = "2.2.0"
accompanist = "0.22.0-rc"
coil = "2.4.0"
xunwind = "2.0.0"
activity-ktx= "1.7.0"
core-splashscreen = "1.0.1"
benchmark = "1.4.1"
profileinstaller = "1.4.1"
uiautomator = "2.3.0"
baselineprofile-plugin = "1.4.1"
okio = "3.9.1"
okhttp = "4.12.0"
atomicfu = "0.26.1"
ktor = "3.0.3"
skie = "0.10.11"
wire = "5.0.0"
brotli-dec = "0.1.2"
retrofit = "2.11.0"
tencentShadow = "local"  # vendor/Shadow 发到 mavenLocal 的版本号（PUBLISH_RELEASE=true 时固定为 'local'）

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso" }
kotlin-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlin-serialization" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

startup = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup" }
activity-ktx  = {group = "androidx.activity", name= "activity-ktx", version.ref = "activity-ktx"}
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "compose-activity" }
compose-compiler = { group = "androidx.compose.compiler", name = "compiler", version.ref = "compose-compiler" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose-foundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "compose-foundation" }
compose-material = { group = "androidx.compose.material", name = "material", version.ref = "compose-foundation" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose-foundation" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose-runtime" }
compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "compose-runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose-ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose-ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose-ui" }
compose-ui-util = { group = "androidx.compose.ui", name = "ui-util", version.ref = "compose-ui" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "compose-navigation" }
compose-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "compose-viewmodel" }
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose-runtime" }
compose-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "compose-constraintlayout" }

exoplayer-core = { group = "com.google.android.exoplayer", name = "exoplayer-core", version.ref = "exoplayer" }
exoplayer-ui = { group = "com.google.android.exoplayer", name = "exoplayer-ui", version.ref = "exoplayer" }

dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment-ktx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

permission = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
image = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
unwind = { group = "io.github.hexhacking", name = "xunwind", version.ref = "xunwind" }
easypermissions = { group = "pub.devrel", name = "easypermissions", version = "3.0.0" }
lame-android = { group = "com.github.NorthernCaptain", name = "TAndroidLame", version = "1.1" }

# Gradle plugins as libraries (for build-logic convention plugins)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

# TTS / KMP shared libraries
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# httpopt experiment deps (Step 3)
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
brotli-dec = { module = "org.brotli:dec", version.ref = "brotli-dec" }

# Shadow 插件化（由 vendor/Shadow publish 到 mavenLocal 解析，version=local）
tencent-shadow-core-common = { module = "com.tencent.shadow.core:common", version.ref = "tencentShadow" }
tencent-shadow-core-runtime = { module = "com.tencent.shadow.core:runtime", version.ref = "tencentShadow" }
tencent-shadow-core-loader = { module = "com.tencent.shadow.core:loader", version.ref = "tencentShadow" }
tencent-shadow-core-manager = { module = "com.tencent.shadow.core:manager", version.ref = "tencentShadow" }
tencent-shadow-core-activity-container = { module = "com.tencent.shadow.core:activity-container", version.ref = "tencentShadow" }
tencent-shadow-dynamic-host = { module = "com.tencent.shadow.dynamic:host", version.ref = "tencentShadow" }
tencent-shadow-dynamic-manager = { module = "com.tencent.shadow.dynamic:manager", version.ref = "tencentShadow" }
tencent-shadow-dynamic-loader = { module = "com.tencent.shadow.dynamic:loader", version.ref = "tencentShadow" }
tencent-shadow-dynamic-loader-impl = { module = "com.tencent.shadow.dynamic:loader-impl", version.ref = "tencentShadow" }

# 插件版本 API 客户端
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }

[bundles]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize",  version.ref = "kotlin"  }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
ksp = { id = "com.google.devtools.ksp", version = "2.0.21-1.0.28" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile-plugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
tencent-shadow-plugin = { id = "com.tencent.shadow.plugin", version.ref = "tencentShadow" }
atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "atomicfu" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
