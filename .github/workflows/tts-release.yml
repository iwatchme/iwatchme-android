name: TTS SDK Release

on:
  push:
    tags:
      - "tts-v*"

permissions:
  contents: write
  packages: write

defaults:
  run:
    working-directory: tts

jobs:
  # ── Android / JVM: publish to GitHub Packages Maven ──
  publish-maven:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#tts-v}" >> "$GITHUB_ENV"

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── iOS: build XCFrameworks and upload to GitHub Release ──
  publish-xcframework:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#tts-v}" >> "$GITHUB_ENV"

      - name: Build XCFrameworks
        run: |
          ./gradlew :tts-core:assembleTtsCoreReleaseXCFramework
          ./gradlew :tts-cloudflare:assembleTtsCloudflareReleaseXCFramework

      - name: Zip XCFrameworks
        run: |
          cd tts-core/build/XCFrameworks/release
          zip -r ../../../../TtsCore.xcframework.zip TtsCore.xcframework
          cd ../../../../
          cd tts-cloudflare/build/XCFrameworks/release
          zip -r ../../../../TtsCloudflare.xcframework.zip TtsCloudflare.xcframework

      - name: Compute checksums
        id: checksums
        run: |
          echo "tts_core_checksum=$(swift package compute-checksum TtsCore.xcframework.zip)" >> "$GITHUB_OUTPUT"
          echo "tts_cloudflare_checksum=$(swift package compute-checksum TtsCloudflare.xcframework.zip)" >> "$GITHUB_OUTPUT"

      - name: Generate Package.swift
        run: |
          TAG="${GITHUB_REF_NAME}"
          CORE_CHECKSUM="${{ steps.checksums.outputs.tts_core_checksum }}"
          CLOUDFLARE_CHECKSUM="${{ steps.checksums.outputs.tts_cloudflare_checksum }}"
          REPO_URL="https://github.com/iwatchme/iwatchme-android/releases/download/${TAG}"

          cat > Package.swift << SWIFT
          // swift-tools-version:5.9
          import PackageDescription

          let package = Package(
              name: "TtsSdk",
              platforms: [
                  .iOS(.v14),
              ],
              products: [
                  .library(name: "TtsCore", targets: ["TtsCore"]),
                  .library(name: "TtsCloudflare", targets: ["TtsCloudflare"]),
              ],
              targets: [
                  .binaryTarget(
                      name: "TtsCore",
                      url: "${REPO_URL}/TtsCore.xcframework.zip",
                      checksum: "${CORE_CHECKSUM}"
                  ),
                  .binaryTarget(
                      name: "TtsCloudflare",
                      url: "${REPO_URL}/TtsCloudflare.xcframework.zip",
                      checksum: "${CLOUDFLARE_CHECKSUM}"
                  ),
              ]
          )
          SWIFT

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tts/TtsCore.xcframework.zip
            tts/TtsCloudflare.xcframework.zip
            tts/Package.swift
          fail_on_unmatched_files: true

  # ── Update Package.swift in repo after release ──
  update-package-swift:
    needs: publish-xcframework
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Package.swift from release
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release download "${TAG}" -p "Package.swift" -D tts/ --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tts/Package.swift
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update tts Package.swift for ${GITHUB_REF_NAME}"
            git push
          fi
        working-directory: .
